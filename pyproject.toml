[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/industrial_iot", "ETL"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Les pages Streamlit contiennent des appels de graphiques longs mais lisibles.
"dashboard/**" = ["E501"]
